<header class="sticky top-0 z-40 w-full bg-[#090a0f]/90 backdrop-blur-md border-b border-white/5 transition-all">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between gap-4">
    
    <!-- Zone 1: Single Text Element Wordmark -->
    <a href="#hero" class="text-base sm:text-lg font-bold tracking-tight text-white hover:text-emerald-400 transition-colors whitespace-nowrap flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Md. Maruf Billah</span>
    </a>

    <!-- Zone 2: Clean Text Navigation Links -->
    <nav class="hidden md:flex items-center gap-7 text-xs tracking-wider uppercase font-medium text-zinc-400">
      <a href="#experience" class="hover:text-white transition-colors">Experience</a>
      <a href="#architectures" class="hover:text-white transition-colors">Projects</a>
      <a href="#domains" class="hover:text-white transition-colors">Domains</a>
      <a href="#skills" class="hover:text-white transition-colors">Skills</a>
      <a href="#cv-story" class="hover:text-white transition-colors">CV Dossier</a>
      <a href="#contact" class="hover:text-white transition-colors">Contact</a>
    </nav>

    <!-- Zone 3: 1-2 Primary Actions -->
    <div class="flex items-center gap-2.5">
      @if (portfolio.pwaInstallable() && !portfolio.pwaInstalled()) {
        <button
          type="button"
          (click)="portfolio.installApp()"
          class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-zinc-300 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg transition-colors whitespace-nowrap"
          title="Install developer profile to device for offline access"
        >
          <mat-icon class="text-base leading-none">download_for_offline</mat-icon>
          <span>Install</span>
        </button>
      }

      <!-- Cloud Dossier Export Action -->
      <button
        type="button"
        (click)="portfolio.openDossierExport()"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-zinc-300 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg transition-colors whitespace-nowrap"
        title="Export Technical Dossier for Cloud Drive"
      >
        <mat-icon class="text-base leading-none text-sky-400">cloud_download</mat-icon>
        <span class="hidden sm:inline">Export Dossier</span>
      </button>

      <!-- Quick Share & Networking Action -->
      <button
        type="button"
        (click)="portfolio.openQuickShare()"
        class="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold text-zinc-950 bg-emerald-400 hover:bg-emerald-300 rounded-lg shadow-sm hover:shadow transition-all whitespace-nowrap"
      >
        <mat-icon class="text-base leading-none">qr_code_2</mat-icon>
        <span>Quick Share</span>
      </button>
    </div>

  </div>
</header>
